[aliases.files]
"aliases/aliases.nu" = { target = "~/Library/Application Support/nushell/vendor/autoload/30-aliases.nu", type = "symbolic", if = "dotter.packages.nushell" }

[homebrew.variables]
homebrew_prefix = "/opt/homebrew"

[homebrew.files]
"homebrew/init.nu" = { target = "~/Library/Application Support/nushell/vendor/autoload/10-homebrew.nu", type = "symbolic", if = "dotter.packages.nushell" }

[latex.files]
"latex/packages" = { target = "~/.local/opt/texmf/tex/latex", type = "symbolic" }

[nushell.files]
"nushell" = "~/Library/Application Support/nushell"

[tt.files]
"tt/config.toml" = "~/Library/Application Support/tt/config.toml"
